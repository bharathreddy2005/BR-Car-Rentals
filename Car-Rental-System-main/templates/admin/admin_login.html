{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BR Car Rentals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'admin/admin.css' %}">
</head>

<body class="admin-login-body">

<div class="login-card">
    <h2>BR Car Rentals</h2>
    <p class="text-muted mb-3">Administrator Panel</p>

    {% include 'messages.html' %}

    <form method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label class="font-weight-bold small text-secondary">Username or Email</label>
            <input
                type="text"
                class="form-control"
                name="username"
                placeholder="admin"
                autocapitalize="none"
                autocorrect="off"
                autocomplete="username"
                required>
        </div>

        <div class="form-group">
            <label class="font-weight-bold small text-secondary">Password</label>
            <input
                type="password"
                class="form-control"
                name="password"
                placeholder="admin123"
                autocomplete="current-password"
                required>
        </div>

        <button type="submit" class="btn btn-dark btn-block font-weight-bold py-2">
            Login as Admin
        </button>

        <div class="text-center mt-3">
            <small class="text-muted">
                Default: <code>admin</code> / <code>admin123</code>
            </small>
        </div>
    </form>
</div>

</body>
</html>
