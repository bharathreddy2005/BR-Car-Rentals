{% extends 'base.html' %}
{% load static %}

{% block title %}404 - Page Not Found{% endblock %}

{% block body %}
<section class="container py-5 text-center" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="col-md-8 mx-auto py-5">
        <div class="mb-4">
            <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
        </div>
        <h1 class="display-3 font-weight-bold">404</h1>
        <h2 class="h3 font-weight-bold mb-3">Oops! Page Not Found</h2>
        <p class="text-muted lead mb-4">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center flex-wrap" style="gap: 15px;">
            <a href="{% url 'home' %}" class="btn btn-warning btn-lg px-4 font-weight-bold">
                <i class="fas fa-home mr-2"></i> Go to Homepage
            </a>
            <a href="{% url 'vehicles' %}" class="btn btn-dark btn-lg px-4">
                <i class="fas fa-car mr-2"></i> Explore Cars
            </a>
        </div>
    </div>
</section>
{% endblock %}
